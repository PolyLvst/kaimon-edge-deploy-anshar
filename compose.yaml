services:
  kaimon-edge-anshar:
    image: polylvst/kaimon-edge-anshar:latest
    container_name: kaimon-edge-anshar
    ports:
      - "8000:8000"
    environment:
      - FACE_THRESHOLD=${FACE_THRESHOLD:-0.60}
      # Default 0.6 for ArcFace, lower to make recognition more strict
      # Changing threshold does not require refreshing embeddings
      # Refuse to answer when rank 1 and rank 2 are this close. 0 disables the
      # check, which is exactly the old threshold-only behaviour. Needs at least
      # 2 enrollment photos per student to be safe - see FACE_FINDINGS_2026-08-13.md
      - FACE_MARGIN=${FACE_MARGIN:-0}
      - FACE_MARGIN_MODE=${FACE_MARGIN_MODE:-absolute}
      - FACE_TOPK=${FACE_TOPK:-5}
      # Model and detector are NOT wired to .env on purpose: changing either
      # invalidates every stored embedding and requires re-enrolling everyone.
      - FACE_MODEL_NAME=ArcFace
      - FACE_BACKEND_NAME=mtcnn
      - FACE_DISTANCE_METRIC=cosine
      - EDGE_DEVICE_ID=${EDGE_DEVICE_ID:-edge-1}
      - MAIN_HUB_URL=${MAIN_HUB_URL:-}
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS:-30}
      - HUB_SYNC_INTERVAL_SECONDS=${HUB_SYNC_INTERVAL_SECONDS:-30}
    restart: unless-stopped
    volumes:
      - ./data/db:/app/db
      - ./data/.deepface:/root/.deepface

  kaimon-edge-fe-anshar:
    image: polylvst/kaimon-edge-fe-anshar:latest
    container_name: kaimon-edge-fe-anshar
    ports:
      - "3000:80"
    environment:
      # Idle attract video — applied at container start, no image rebuild needed
      - IDLE_VIDEO_ENABLED=${IDLE_VIDEO_ENABLED:-false}
      - IDLE_VIDEO_URL=${IDLE_VIDEO_URL:-}
      - IDLE_VIDEO_DELAY_SECONDS=${IDLE_VIDEO_DELAY_SECONDS:-30}
      - IDLE_VIDEO_MUTED=${IDLE_VIDEO_MUTED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - kaimon-edge-anshar
    restart: unless-stopped
